<!-- chat.html — loaded into #chat-section by componentLoader -->
<link rel="stylesheet" href="assets/css/chat.css" />

<div class="chat-container">
  <!-- Left panel: conversation list -->
  <div class="chat-sidebar" id="chat-sidebar">
    <div class="chat-sidebar-header">
      <h2 class="text-base font-bold text-white">Tin nhắn</h2>
      <button id="new-chat-btn" class="chat-new-btn" title="Cuộc trò chuyện mới">
        <i class="fas fa-edit"></i>
      </button>
    </div>
    <div id="conversation-list" class="conversation-list">
      <p class="conv-empty text-xs text-center py-8 text-slate-400">
        <i class="fas fa-comment-dots text-2xl mb-2 block text-slate-300"></i>
        Chưa có cuộc trò chuyện nào
      </p>
    </div>
  </div>

  <!-- Right panel: active conversation -->
  <div class="chat-main" id="chat-main">
    <!-- Empty state when no conversation selected -->
    <div class="chat-empty-state" id="chat-empty-state">
      <i class="fas fa-comments text-5xl text-slate-300 mb-4"></i>
      <p class="text-slate-400 text-sm">Chọn một cuộc trò chuyện để bắt đầu</p>
    </div>

    <!-- Active conversation (hidden until selected) -->
    <div id="chat-active" class="hidden flex flex-col h-full">
      <div id="chat-header" class="chat-main-header">
        <button id="chat-back-btn" class="chat-back-btn lg:hidden">
          <i class="fas fa-arrow-left"></i>
        </button>
        <div id="chat-header-avatar" class="chat-header-avatar"></div>
        <div>
          <div id="chat-header-name" class="font-semibold text-sm text-slate-800"></div>
          <div id="chat-header-sub" class="text-xs text-slate-400"></div>
        </div>
      </div>

      <div id="message-area" class="message-area">
        <div id="messages-inner" class="messages-inner"></div>
      </div>

      <div id="chat-input-area" class="chat-input-area">
        <input
          type="text"
          id="chat-input"
          class="chat-input"
          placeholder="Nhập tin nhắn..."
          maxlength="2000"
          autocomplete="off"
        />
        <button id="chat-send-btn" class="chat-send-btn" title="Gửi">
          <i class="fas fa-paper-plane"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- New direct chat modal -->
<div id="new-chat-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40">
  <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-sm mx-4">
    <h2 class="text-base font-bold text-slate-800 mb-3">Nhắn tin mới</h2>
    <input
      id="new-chat-search"
      type="text"
      placeholder="Tìm bạn bè theo tên..."
      class="w-full px-3 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:border-transparent mb-3"
    />
    <div id="new-chat-results" class="max-h-48 overflow-y-auto space-y-1"></div>
    <button id="cancel-new-chat"
      class="mt-4 w-full py-2 rounded-xl text-sm font-medium border border-slate-200 text-slate-600 hover:bg-slate-50">
      Huỷ
    </button>
  </div>
</div>

<script>
  (function () {
    if (window.ChatConversation) ChatConversation.init();
  })();
</script>
