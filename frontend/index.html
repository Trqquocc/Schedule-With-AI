<!DOCTYPE html>

  <style>
    #sidebar-container,
    #sidebar-container * {
      box-sizing: border-box !important;
    }

    #sidebar-container {
      position: fixed !important;
      left: 0 !important;
      top: 0 !important;
      width: 256px !important;
      height: 100vh !important;
      overflow: hidden !important;
      z-index: 999 !important;
    }

    #sidebar-container aside {
      position: relative !important;
      left: 0 !important;
      right: 0 !important;
      top: 0 !important;
      margin-left: 0 !important;
      box-sizing: border-box !important;
      width: 256px !important;
      height: 100vh !important;
    }
  </style>

      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="

      referrerpolicy="no-referrer"

    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }

      #auth-loading {
        position: fixed;
        inset: 0;
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      .loading-spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #dc2626;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #main-app {
        display: none;
      }

      #main-app.ready {
        display: block;
      }

      body:not(.fa-loaded) i[class*="fa-"],
      body:not(.fa-loaded) span[class*="fa-"] {
        opacity: 0;
      }

      body.fa-loaded i[class*="fa-"],
      body.fa-loaded span[class*="fa-"] {
        opacity: 1;
        transition: opacity 0.2s ease-in-out;
      }

      #calendar {
        min-height: 600px;
        height: calc(100vh - 200px);
      }

      .fc-event-dragging {
        opacity: 0.7;
        cursor: move !important;
      }

      [draggable="true"] {
        cursor: move;
        transition: opacity 0.2s;
      }

      [draggable="true"]:hover {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <script>
      (function forceSidebarEarly() {
        const style = document.createElement("style");
        style.innerHTML = `
          #sidebar-container {
            display: block !important;
            position: fixed !important;
            left: 0 !important;
            top: 0 !important;
            width: 256px !important;
            min-width: 256px !important;
            height: 100vh !important;
            z-index: 999 !important;
            visibility: visible !important;
            opacity: 1 !important;
          }
          #sidebar-container.hidden,
          #sidebar-container.hidden * {
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
          }
        `;
        document.head.appendChild(style);
        console.log(" Sidebar force styles injected at page start");
      })();
    </script>

    <script>
      window.debugSidebar = function () {
        const container = document.getElementById("sidebar-container");
        console.log("=== SIDEBAR DEBUG ===");
        console.log("Container exists:", !!container);
        console.log("Container HTML length:", container?.innerHTML.length);
        console.log("Container children count:", container?.children.length);
        console.log(
          "Container innerHTML preview:",
          container?.innerHTML.substring(0, 150)
        );
        const aside = container?.querySelector("aside");
        console.log("Aside element:", !!aside);
        if (aside) {
          const styles = window.getComputedStyle(aside);
          console.log("Aside computed display:", styles.display);
          console.log("Aside computed visibility:", styles.visibility);
          console.log("Aside computed opacity:", styles.opacity);
          console.log(
            "Aside nav children:",
            aside.querySelectorAll("nav button").length
          );
        }
      };

      window.addEventListener("load", () => {
        setTimeout(() => {
          console.log("\n=== AUTO DEBUG AFTER LOAD ===");
          window.debugSidebar();
          const container = document.getElementById("sidebar-container");
          const containerStyles = window.getComputedStyle(container);
          console.log("\n=== CONTAINER COMPUTED STYLES ===");
          console.log("Container display:", containerStyles.display);
          console.log("Container position:", containerStyles.position);
          console.log("Container left:", containerStyles.left);
          console.log("Container width:", containerStyles.width);
          console.log("Container z-index:", containerStyles.zIndex);
          console.log("Container visibility:", containerStyles.visibility);
          console.log("Container opacity:", containerStyles.opacity);
          console.log("Container background:", containerStyles.background);
        }, 2000);
      });
    </script>

    <script>
      // Load auth modal HTML early, then start app
      (function () {
        function loadAuthModal(callback) {
          const container = document.getElementById('authModalContainer');
          if (!container) return callback();
          fetch('components/modals/auth-modal.html')
            .then(r => r.text())
            .then(html => { container.innerHTML = html; callback(); })
            .catch(() => callback());
        }

        function startApp() {
          if (window.App?.init) {
            App.init();
          } else {
            setTimeout(startApp, 100);
          }
        }

        loadAuthModal(() => {
          if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", startApp);
          } else {
            startApp();
          }
        });
      })();
    </script>
  </body>
