<div class="modal-overlay" data-modal-close></div>

<div class="modal-content-wrapper">
  <div class="modal-content rounded-2xl shadow-2xl overflow-hidden" id="scheduleImportModalContent">
    <!-- Header -->
    <div class="modal-header sticky top-0 z-10 px-6 py-4 flex justify-between items-center"
         style="background:linear-gradient(135deg,#1e3a5f 0%,#1e293b 100%)">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:rgba(255,255,255,0.15)">
          <i class="fas fa-camera text-white text-sm"></i>
        </div>
        <div>
          <h2 class="text-base font-bold" style="color:#f1f5f9">Import lịch từ ảnh</h2>
          <p class="text-xs" style="color:#94a3b8">Upload ảnh lịch học/làm — AI sẽ đọc và tạo công việc tự động</p>
        </div>
      </div>
      <button id="scheduleImportCloseBtn"
              class="w-8 h-8 rounded-lg flex items-center justify-center"
              style="background:rgba(255,255,255,0.1);color:#94a3b8" aria-label="Close">
        <i class="fas fa-times text-sm"></i>
      </button>
    </div>

    <div class="modal-body p-5 overflow-y-auto" style="max-height:78vh">
      <!-- Step 1: type + level -->
      <div class="mb-4 grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold text-slate-600 mb-1 block">Loại lịch</label>
          <div class="flex gap-2" id="scheduleImportTypeRow">
            <label class="flex-1 cursor-pointer">
              <input type="radio" name="si-type" value="study" class="hidden peer" checked>
              <div class="px-3 py-2 rounded-lg border text-center text-sm peer-checked:bg-blue-50 peer-checked:border-blue-500 peer-checked:text-blue-700 border-slate-200 text-slate-600">
                <i class="fas fa-graduation-cap mr-1"></i>Lịch học
              </div>
            </label>
            <label class="flex-1 cursor-pointer">
              <input type="radio" name="si-type" value="work" class="hidden peer">
              <div class="px-3 py-2 rounded-lg border text-center text-sm peer-checked:bg-blue-50 peer-checked:border-blue-500 peer-checked:text-blue-700 border-slate-200 text-slate-600">
                <i class="fas fa-briefcase mr-1"></i>Lịch làm
              </div>
            </label>
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600 mb-1 block">Cấp học vấn</label>
          <select id="scheduleImportLevel"
                  class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm text-slate-700 bg-white">
            <option value="dai_hoc">Đại học</option>
            <option value="thpt">Cấp 3 (THPT)</option>
            <option value="thcs">Cấp 2 (THCS)</option>
            <option value="di_lam">Đang đi làm</option>
            <option value="khac">Khác</option>
          </select>
        </div>
      </div>

      <!-- Step 2: dropzone -->
      <div id="scheduleImportDropzone"
           class="border-2 border-dashed rounded-xl p-6 text-center cursor-pointer transition-all"
           style="border-color:#cbd5e1;background:#f8fafc">
        <i class="fas fa-cloud-upload-alt text-3xl mb-2" style="color:#64748b"></i>
        <p class="text-sm font-semibold text-slate-700">Kéo ảnh vào đây, bấm chọn, hoặc Ctrl+V</p>
        <p class="text-xs text-slate-500 mt-1">JPG / PNG / WEBP — tối đa 8MB</p>
        <input type="file" id="scheduleImportFileInput" class="hidden" accept="image/jpeg,image/png,image/webp">
      </div>

      <!-- Thumbnail + parse action -->
      <div id="scheduleImportThumbWrap" class="hidden mt-3 flex items-center gap-3">
        <img id="scheduleImportThumb" class="w-24 h-24 rounded-lg object-cover border border-slate-200" alt="">
        <div class="flex-1">
          <p id="scheduleImportFileName" class="text-sm font-semibold text-slate-700 truncate"></p>
          <p id="scheduleImportFileMeta" class="text-xs text-slate-500"></p>
        </div>
        <button id="scheduleImportParseBtn"
                class="px-4 py-2 rounded-lg text-sm font-semibold text-white"
                style="background:linear-gradient(135deg,#dc2626,#4f46e5)">
          <i class="fas fa-wand-magic-sparkles mr-1"></i>Phân tích ảnh
        </button>
      </div>

      <!-- Loading / error banners -->
      <div id="scheduleImportStatus" class="hidden mt-3 p-3 rounded-lg text-sm"></div>

      <!-- Step 3: extracted items table -->
      <div id="scheduleImportPreview" class="hidden mt-4">
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-sm font-bold text-slate-800">
            <i class="fas fa-list-check mr-1"></i>Công việc trích xuất
            (<span id="scheduleImportCount">0</span>)
          </h3>
          <div class="flex gap-2">
            <button id="scheduleImportAddBtn"
                    class="px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-200 text-slate-700 bg-white">
              <i class="fas fa-plus mr-1"></i>Thêm thủ công
            </button>
            <button id="scheduleImportRescanBtn"
                    class="px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-200 text-slate-700 bg-white">
              <i class="fas fa-rotate mr-1"></i>Quét lại
            </button>
          </div>
        </div>
        <div class="overflow-x-auto border border-slate-200 rounded-lg">
          <table class="w-full text-xs" id="scheduleImportTable">
            <thead class="bg-slate-50 text-slate-600">
              <tr>
                <th class="px-2 py-2 text-left">Tên</th>
                <th class="px-2 py-2 text-left">Bắt đầu</th>
                <th class="px-2 py-2 text-left">Kết thúc</th>
                <th class="px-2 py-2 text-left">Ghi chú</th>
                <th class="px-2 py-2"></th>
              </tr>
            </thead>
            <tbody id="scheduleImportTbody"></tbody>
          </table>
        </div>
        <div id="scheduleImportWarnings" class="hidden mt-2 text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg p-2"></div>
      </div>

      <!-- Step 4: footer actions -->
      <div id="scheduleImportFooter" class="hidden flex justify-end gap-2 pt-4 mt-4 border-t border-slate-200">
        <button id="scheduleImportSaveBtn"
                class="px-4 py-2 rounded-lg text-sm font-semibold border border-slate-300 text-slate-700 bg-white">
          <i class="fas fa-floppy-disk mr-1"></i>Lưu việc
        </button>
        <button id="scheduleImportApplyBtn"
                class="px-4 py-2 rounded-lg text-sm font-semibold text-white"
                style="background:linear-gradient(135deg,#dc2626,#4f46e5)">
          <i class="fas fa-bolt mr-1"></i>Áp dụng
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  // Lazy init: once the modal HTML is loaded, boot the controller if module is ready
  if (window.ScheduleImageUpload && typeof window.ScheduleImageUpload.init === 'function') {
    window.ScheduleImageUpload.init();
  }
</script>
